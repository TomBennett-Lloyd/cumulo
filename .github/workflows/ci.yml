name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One step, not one step per gate. Enumerating the gates here duplicates
      # the `verify` script's list, and the duplicate drifts: `pnpm test:scripts`
      # was added to `verify` and never reached CI, so the shell harness was
      # green-by-absence. Calling the composite makes CI a caller like any other,
      # so a gate added to `verify` is automatically enforced here.
      # The cost is real but small: GitHub shows one step's timing and one
      # failure marker instead of per-gate ones. The composite runs its gates in
      # a fixed order and stops at the first failure, so the log still names the
      # failing one. Which gates those are is deliberately not written here —
      # package.json is the single place that list lives, and restating it would
      # re-create exactly the duplicate this step exists to remove.
      # Gate completeness beats step granularity.
      #
      # No `apt-get install shellcheck` step, even though the composite shells
      # out to it: the runner image ships shellcheck. Verified against
      # actions/runner-images, not assumed — images/ubuntu/Ubuntu2404-Readme.md
      # (ubuntu-latest today) lists shellcheck 0.9.0-1, and Ubuntu2204-Readme.md
      # lists 0.8.0-2, so this survives the next ubuntu-latest rollover too. If a
      # future image drops it, the shell gate hard-fails with install
      # instructions rather than passing by skipping.
      # Open caveat, first checked on this PR's own CI run: local Homebrew is on
      # 0.11.0, so the runner lints with an older shellcheck than a developer
      # does. Newer versions add checks, which makes CI the more permissive of
      # the two — the safe direction, but not a pinned one.
      - run: pnpm verify

  # The only job here that produces a build, and the one deliberate exception to
  # the rule the comment above states — that CI calls the `verify` composite and
  # never a hand-picked gate.
  #
  # (a) Why not a gate inside `verify`: `verify` has no build step at all, and
  #     whether it should is #111's question — per-package `build` scripts,
  #     `pnpm -r build` joining the composite, the artefact-path vs `dist/**`
  #     lint-exemption decision, and the verify-time cost. Answering half of it
  #     here would be reworked when #111 lands. So the split is drawn where it
  #     costs nothing: the gate *script* takes a repo root and builds nothing, so
  #     #111 can call it from `verify` unchanged, at which point this job folds
  #     into the composite and disappears. Its test harness is already in
  #     `verify` today (run-script-tests.sh discovers it) — only the production
  #     call site is waiting on #111.
  # (b) Why not a step appended to `checks`: it runs in parallel, so wall time is
  #     unchanged, and a red "web-build" names the failing surface directly
  #     rather than hiding inside a composite step. The build is ~0.6 s; the cost
  #     is the ~1 min checkout+install, parallel and well inside the free tier.
  # (c) The entry budget lives only in .claude/scripts/check-web-bundle.sh and is
  #     deliberately not restated here — one enforced copy, per that constant's
  #     own comment.
  # (d) The advisory half of the size story is Vite's `chunkSizeWarningLimit`
  #     (apps/web/vite.config.ts), whose warning about the lazily imported map
  #     chunk prints in the build step's log; the assert step lists every
  #     dist/assets file by size there too. Advisory in the log, enforced on the
  #     entry chunk only.
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build web (production)
        run: pnpm --filter @cumulo/web build
      - name: assert bundle properties
        run: bash .claude/scripts/check-web-bundle.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs on every push and PR, not just infra/** changes: a job that only fires
  # when Terraform changes cannot tell you that Terraform still works after
  # something else moved underneath it.
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          # Exact patch pin, matched to the version infra/README.md tells
          # operators to install, so CI and humans can never disagree about fmt
          # output or backend behaviour. Must stay inside the >= 1.12.0, < 2.0.0
          # range that every stack's versions.tf declares.
          terraform_version: 1.15.8
          # Raw exit codes, not step outputs — nothing here consumes stdout.
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive infra
      # Each stack is initialised and validated separately: they have separate
      # state, separate provider lock files, and no dependency on each other's
      # resources, so a break in one must not be masked by the other.
      #
      # -backend=false because CI has no state-bucket access and needs none to
      # validate — which is also what keeps the OIDC role at zero permissions.
      # -lockfile=readonly makes a stale .terraform.lock.hcl a build failure
      # instead of something CI quietly fixes for itself.
      - name: terraform init (bootstrap)
        run: terraform -chdir=infra/bootstrap init -backend=false -lockfile=readonly
      - name: terraform validate (bootstrap)
        run: terraform -chdir=infra/bootstrap validate
      - name: terraform init (alerting)
        run: terraform -chdir=infra/alerting init -backend=false -lockfile=readonly
      - name: terraform validate (alerting)
        run: terraform -chdir=infra/alerting validate
      - name: terraform init (storage)
        run: terraform -chdir=infra/storage init -backend=false -lockfile=readonly
      - name: terraform validate (storage)
        run: terraform -chdir=infra/storage validate
      - name: terraform init (ingestion)
        run: terraform -chdir=infra/ingestion init -backend=false -lockfile=readonly
      - name: terraform validate (ingestion)
        run: terraform -chdir=infra/ingestion validate
      # The api stack validates without a built Lambda artefact, deliberately —
      # `fileexists` guards the `source_code_hash` call and a resource
      # precondition carries the missing-artefact error at plan time instead.
      # Same asymmetry as the ingestion stack: CI builds no Lambda artefact (the
      # web-build job above builds the browser bundle and nothing else).
      - name: terraform init (api)
        run: terraform -chdir=infra/api init -backend=false -lockfile=readonly
      - name: terraform validate (api)
        run: terraform -chdir=infra/api validate
      # The forecast stack validates without a built artefact for the same
      # reason the two above do. It is also the stack where validate earns its
      # keep hardest: the event source mapping's scaling_config carries a
      # provider-enforced floor (maximum_concurrency >= 2), so a value below it
      # fails here rather than at somebody's apply.
      - name: terraform init (forecast)
        run: terraform -chdir=infra/forecast init -backend=false -lockfile=readonly
      - name: terraform validate (forecast)
        run: terraform -chdir=infra/forecast validate
      # The web stack has no Lambda artefact, but it has the same class of
      # asymmetry the api note above describes, in a different place: `validate`
      # never reads a data source, so the `Managed-CachingOptimized` cache
      # policy this stack looks up by name is unchecked here. A wrong name
      # passes CI and fails at the first `terraform plan`, which is where the
      # comment in infra/web/cloudfront.tf points the reader.
      - name: terraform init (web)
        run: terraform -chdir=infra/web init -backend=false -lockfile=readonly
      - name: terraform validate (web)
        run: terraform -chdir=infra/web validate
